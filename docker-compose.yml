services:
  neo4j:
    image: neo4j:5-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-change-me} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  ollama:
    image: ollama/ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ollama_data:/root/.ollama

  # baixa o modelo uma vez; o volume ollama_data guarda para as próximas subidas
  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      EMBEDDING_DIMENSION: 384
    depends_on:
      neo4j:
        condition: service_healthy
    command: >-
      sh -c "python -m scripts.migrate
      && python -m scripts.load_sample --input data/raw/titles.json
      && python -m scripts.run_text_to_graph --input data/raw/titles.json
      && python -m scripts.build_embeddings
      && python -m scripts.evaluate
      && python -m scripts.run_ner_re"
    volumes:
      - ./data:/app/data

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      EMBEDDING_DIMENSION: 384
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      OLLAMA_URL: http://ollama:11434
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
