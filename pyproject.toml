[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-kag-ciencia-computacao"
version = "0.1.0"
description = "Projeto acadêmico de GraphRAG e KAG com Neo4j"
requires-python = ">=3.11"
dependencies = [
  "neo4j>=5.20",
  "streamlit>=1.40"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
